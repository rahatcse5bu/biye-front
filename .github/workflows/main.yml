name: Vercel deployment

on:
  push:
    branches:
      - main
  pull_request:

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Set Vercel environment
        run: echo "VERCEL_ENV=${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'production' || 'preview' }}" >> "$GITHUB_ENV"

      - name: Pull Vercel environment information
        run: vercel pull --yes --environment=$VERCEL_ENV --token=${{ secrets.VERCEL_TOKEN }}

      # TODO: Vercel "Sensitive" vars can't be read outside Vercel's builders and arrive as "[SENSITIVE]".
      - name: Check pulled environment variables
        run: |
          bad=$(grep -oE '^[A-Z0-9_]+="?\[SENSITIVE\]' ".vercel/.env.$VERCEL_ENV.local" | cut -d= -f1 || true)
          if [ -n "$bad" ]; then
            echo "::warning::Marked Sensitive in Vercel, unreadable in this build: $(echo $bad)"
            if echo "$bad" | grep -q '^NEXT_PUBLIC_'; then
              echo "::error::NEXT_PUBLIC_* values are compiled into the browser bundle; un-mark them as Sensitive in Vercel and re-add them."
              exit 1
            fi
          fi

      - name: Build project artifacts
        run: vercel build ${{ env.VERCEL_ENV == 'production' && '--prod' || '' }} --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy project artifacts to Vercel
        run: vercel deploy --prebuilt ${{ env.VERCEL_ENV == 'production' && '--prod' || '' }} --token=${{ secrets.VERCEL_TOKEN }}
